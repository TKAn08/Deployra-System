spring.application.name=deployra


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployra}
spring.datasource.username=${DB_USER:deployra}
spring.datasource.password=${DB_PASSWORD:deployra}

# update: Hibernate t\u00e1\u00bb\u00b1 t\u00e1\u00ba\u00a1o/b\u00e1\u00bb\u0095 sung b\u00e1\u00ba\u00a3ng t\u00e1\u00bb\u00ab entity (ti\u00e1\u00bb\u0087n khi \u00c4\u0091ang ph\u00c3\u00a1t tri\u00e1\u00bb\u0083n).
# Khi l\u00c3\u00aan EC2 th\u00e1\u00ba\u00adt n\u00c3\u00aan chuy\u00e1\u00bb\u0083n sang Flyway + ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Flyway m\u00e1\u00ba\u00b7c \u00c4\u0091\u00e1\u00bb\u008bnh T\u00e1\u00ba\u00aeT \u00e1\u00bb\u009f m\u00c3\u00a1y dev (dev d\u00c3\u00b9ng ddl-auto=update). Profile prod b\u00e1\u00ba\u00adt l\u00c3\u00aan, xem application-prod.properties.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.properties.hibernate.format_sql=true

# --- M\u00c3\u00a3 ho\u00c3\u00a1 bi\u00e1\u00ba\u00bfn m\u00c3\u00b4i tr\u00c6\u00b0\u00e1\u00bb\u009dng c\u00e1\u00bb\u00a7a ng\u00c6\u00b0\u00e1\u00bb\u009di d\u00c3\u00b9ng (AES-256-GCM) ---
# T\u00e1\u00ba\u00a1o kho\u00c3\u00a1: openssl rand -base64 32
deployra.crypto.key=${DEPLOYRA_CRYPTO_KEY:}

# RAM th\u00e1\u00ba\u00adt c\u00c3\u00b3 th\u00e1\u00bb\u0083 b\u00c3\u00a1n c\u00e1\u00bb\u00a7a 1 node (t3.medium 4GB, ch\u00e1\u00bb\u00aba ~1GB cho control plane).
# Tr\u00e1\u00ba\u00a7n RAM/service c\u00e1\u00bb\u00a7a m\u00e1\u00bb\u008di g\u00c3\u00b3i kh\u00c3\u00b4ng \u00c4\u0091\u00c6\u00b0\u00e1\u00bb\u00a3c v\u00c6\u00b0\u00e1\u00bb\u00a3t s\u00e1\u00bb\u0091 n\u00c3\u00a0y.
deployra.node.allocatable-mb=${NODE_ALLOCATABLE_MB:3072}

# --- L\u00e1\u00ba\u00a5y m\u00c3\u00a3 ngu\u00e1\u00bb\u0093n t\u00e1\u00bb\u00ab Git (c\u00e1\u00ba\u00a7n c\u00c3\u00a0i git tr\u00c3\u00aan m\u00c3\u00a1y ch\u00e1\u00ba\u00a1y \u00e1\u00bb\u00a9ng d\u00e1\u00bb\u00a5ng) ---
deployra.git.timeout-seconds=${GIT_TIMEOUT_SECONDS:120}
deployra.git.max-repo-mb=${GIT_MAX_REPO_MB:500}

# --- File zip upload ---
# N\u00c6\u00a1i l\u00c6\u00b0u zip khi d\u00c3\u00b9ng LocalSourceStorage (sau n\u00c3\u00a0y \u00c4\u0091\u00e1\u00bb\u0095i sang S3/R2 th\u00c3\u00ac kh\u00c3\u00b4ng d\u00c3\u00b9ng m\u00e1\u00bb\u00a5c n\u00c3\u00a0y)
deployra.storage.local-dir=${STORAGE_DIR:./data/uploads}
# Gi\u00e1\u00bb\u009bi h\u00e1\u00ba\u00a1n c\u00e1\u00bb\u00a9ng khi gi\u00e1\u00ba\u00a3i n\u00c3\u00a9n (ch\u00e1\u00bb\u0091ng zip bomb); gi\u00e1\u00bb\u009bi h\u00e1\u00ba\u00a1n theo g\u00c3\u00b3i l\u00c3\u00a0 max_upload_mb
deployra.upload.retention-days=${UPLOAD_RETENTION_DAYS:30}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:500}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:500}MB
deployra.zip.max-entries=${ZIP_MAX_ENTRIES:20000}
deployra.zip.max-file-mb=${ZIP_MAX_FILE_MB:500}
deployra.zip.max-unpacked-mb=${ZIP_MAX_UNPACKED_MB:1000}

management.endpoints.web.exposure.include=health,info

deployra.jwt.secret=${DEPLOYRA_JWT_SECRET:}
deployra.jwt.expiration-seconds=${DEPLOYRA_JWT_EXPIRATION_SECONDS:3600}



spring.config.import=file:/D:/HocTap/Nam4/HK1/cloud/vnpay-key.properties
deployra.seed.sample-data=${SEED_SAMPLE_DATA:true}
