spring.application.name=deployra

# --- Database (PostgreSQL). Chạy `docker compose up -d postgres` để có DB local ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployra}
spring.datasource.username=${DB_USER:deployra}
spring.datasource.password=${DB_PASSWORD:deployra}

# update: Hibernate tự tạo/bổ sung bảng từ entity (tiện khi đang phát triển).
# Khi lên EC2 thật nên chuyển sang Flyway + ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Mã hoá biến môi trường của người dùng (AES-256-GCM) ---
# Tạo khoá: openssl rand -base64 32
deployra.crypto.key=${DEPLOYRA_CRYPTO_KEY:}

# RAM thật có thể bán của 1 node (t3.medium 4GB, chừa ~1GB cho control plane).
# Trần RAM/service của mọi gói không được vượt số này.
deployra.node.allocatable-mb=${NODE_ALLOCATABLE_MB:3072}

# --- Lấy mã nguồn từ Git (cần cài git trên máy chạy ứng dụng) ---
deployra.git.timeout-seconds=${GIT_TIMEOUT_SECONDS:120}
deployra.git.max-repo-mb=${GIT_MAX_REPO_MB:500}

# --- File zip upload ---
# Nơi lưu zip khi dùng LocalSourceStorage (sau này đổi sang S3/R2 thì không dùng mục này)
deployra.storage.local-dir=${STORAGE_DIR:./data/uploads}
# Giới hạn cứng khi giải nén (chống zip bomb); giới hạn theo gói là max_upload_mb
deployra.upload.retention-days=${UPLOAD_RETENTION_DAYS:30}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:500}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_MB:500}MB
deployra.zip.max-entries=${ZIP_MAX_ENTRIES:20000}
deployra.zip.max-file-mb=${ZIP_MAX_FILE_MB:500}
deployra.zip.max-unpacked-mb=${ZIP_MAX_UNPACKED_MB:1000}

management.endpoints.web.exposure.include=health,info