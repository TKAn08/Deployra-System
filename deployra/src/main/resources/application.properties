spring.application.name=deployra

# --- Database (PostgreSQL). Chạy `docker compose up -d postgres` để có DB local ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deployra}
spring.datasource.username=${DB_USER:deployra}
spring.datasource.password=${DB_PASSWORD:deployra}

# update: Hibernate tự tạo/bổ sung bảng từ entity (tiện khi đang phát triển).
# Khi lên EC2 thật nên chuyển sang Flyway + ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Mã hoá biến môi trường của người dùng (AES-256-GCM) ---
# Tạo khoá: openssl rand -base64 32
deployra.crypto.key=${DEPLOYRA_CRYPTO_KEY:}

# RAM thật có thể bán của 1 node (t3.medium 4GB, chừa ~1GB cho control plane).
# Trần RAM/service của mọi gói không được vượt số này.
deployra.node.allocatable-mb=${NODE_ALLOCATABLE_MB:3072}

management.endpoints.web.exposure.include=health,info
