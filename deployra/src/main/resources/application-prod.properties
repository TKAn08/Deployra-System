# Profile prod: dùng khi chạy trên máy thật (EC2).
# Bật bằng biến môi trường SPRING_PROFILES_ACTIVE=prod (xem docker-compose.stack.yml).
#
# Lưu ý: spring.flyway.* chỉ có tác dụng KHI pom.xml đã có Flyway
# (spring-boot-starter-flyway + flyway-database-postgresql). Chưa có Flyway thì
# profile này vẫn chạy được, nhưng DB trống sẽ không có bảng nào và validate sẽ báo lỗi.
# Xem infra/flyway-checklist.md.

# Hibernate chỉ kiểm tra bảng/cột khớp entity, không tự tạo hay sửa bảng.
spring.jpa.hibernate.ddl-auto=validate

# Flyway chạy các file db/migration/V*.sql khi app khởi động.
spring.flyway.enabled=true

# Nếu DB đã được Hibernate (ddl-auto=update) tạo sẵn bảng từ trước, bỏ comment dòng dưới
# để Flyway coi V1 là đã áp dụng thay vì chạy lại CREATE TABLE và báo lỗi "already exists".
# Với DB trống thì dòng này không ảnh hưởng gì.
# spring.flyway.baseline-on-migrate=true